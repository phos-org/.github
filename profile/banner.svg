<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
  <title id="t">phos</title>
  <desc id="d">The phos wordmark over a soft glow of light on a dark background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0e18"/>
      <stop offset="1" stop-color="#15122a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd9a0" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#e9a86b" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#e9a86b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6d8cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6d8cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffe7c2" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffe7c2" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffe7c2" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" rx="28" fill="url(#bg)"/>
  <circle cx="1060" cy="250" r="260" fill="url(#cool)"/>
  <circle cx="360" cy="160" r="230" fill="url(#glow)"/>
  <!-- light falling from the lantern -->
  <g transform="rotate(-18 360 160)">
    <rect x="60" y="150" width="600" height="3" fill="url(#ray)"/>
    <rect x="80" y="120" width="560" height="2" fill="url(#ray)" opacity="0.6"/>
    <rect x="80" y="182" width="560" height="2" fill="url(#ray)" opacity="0.6"/>
  </g>
  <!-- a small lantern -->
  <g transform="translate(330 96)" fill="none" stroke="#ffe7c2" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <path d="M22 0 h16 M30 0 v10"/>
    <path d="M14 10 h32 l6 12 h-44 z" fill="#ffe7c2" fill-opacity="0.12"/>
    <rect x="12" y="22" width="36" height="58" rx="8" fill="#ffd9a0" fill-opacity="0.16"/>
    <path d="M30 40 c-6 8 -6 16 0 22 c6 -6 6 -14 0 -22 z" fill="#ffd9a0" stroke="none"/>
    <path d="M10 80 h40 l-4 10 h-32 z" fill="#ffe7c2" fill-opacity="0.12"/>
  </g>
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="440" y="176" fill="#fcfcfc" font-size="84" font-weight="700" letter-spacing="-3">phos</text>
    <text x="444" y="222" fill="#b9b4c8" font-size="22">Light, well-made tools for the Linux desktop.</text>
    <text x="444" y="254" fill="#7f7a92" font-size="15" letter-spacing="1.5">φῶς · light</text>
  </g>
</svg>
